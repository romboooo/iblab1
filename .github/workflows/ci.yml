name: Secure REST API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Tests, SAST and dependency audit
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pinned dependencies and scanners
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run API tests
        run: python -m unittest discover -s tests -v

      - name: Run Bandit SAST
        run: bandit -r app.py tests scripts -f json -o bandit-report.json -l -i

      - name: Run pip-audit SCA
        run: pip-audit -r requirements-dev.txt -f json -o pip-audit-report.json --cache-dir "${RUNNER_TEMP}/pip-audit-cache" --progress-spinner off

      - name: Render dependency check HTML
        if: always()
        run: python scripts/render_dependency_report.py pip-audit-report.json dependency-check-report.html

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: dependency-check-report.html
          if-no-files-found: error

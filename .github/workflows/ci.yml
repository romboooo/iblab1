name: Secure REST API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Tests, SAST and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pinned dependencies and scanners
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run API tests
        run: python -m unittest discover -s tests -v

      - name: Run Bandit SAST
        run: bandit -r app.py tests -f json -o bandit-report.json -l -i

      - name: Run pip-audit SCA
        run: pip-audit -r requirements-dev.txt -f json -o pip-audit-report.json --cache-dir "${RUNNER_TEMP}/pip-audit-cache" --progress-spinner off

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: warn
